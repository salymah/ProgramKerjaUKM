# ===================================================
# APPLICATION
# ===================================================
spring.application.name=program-kerja-ukm
server.port=8082

# ===================================================
# DATABASE (MySQL - XAMPP)
# ===================================================
spring.datasource.url=jdbc:mysql://localhost:3306/db_programkerja_ukm?useSSL=false&serverTimezone=Asia/Jakarta&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================
# JPA / HIBERNATE
# Catatan: ddl-auto = validate, BUKAN update/create.
# Struktur tabel sudah final hasil audit manual,
# Hibernate hanya divalidasi cocok terhadap Entity,
# tidak diizinkan mengubah skema otomatis.
# ===================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================================
# FILE UPLOAD (Proposal & Laporan)
# ===================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads

# ===================================================
# JWT
# ===================================================
app.jwt.secret=UkmProgramKerjaRahasiaJWTSecretKeyMinimal256BitUntukHS256Algorithm2026
app.jwt.expiration-ms=86400000

# ===================================================
# SWAGGER / OPENAPI
# ===================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===================================================
# LOGGING
# ===================================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.ukm.programkerja=DEBUG

# ===================================================
# CATATAN MIGRASI V2 (Fitur Baru)
# ===================================================
# Sebelum menjalankan backend versi ini, wajib
# menjalankan file SQL berikut di phpMyAdmin:
#   migration/migration_v2_fitur_baru.sql
# File tersebut menambahkan:
#   - Tabel ukm (organisasi mahasiswa)
#   - Kolom users.ukm_id (relasi ke tabel ukm)
#   - Kolom program_kerja.tanggal_kegiatan
#   - Tabel reset_password_request (fitur lupa password)
#   - Tabel informasi (agenda/pengumuman kampus)
# Setelah SQL dijalankan, ddl-auto=validate di atas
# akan otomatis memvalidasi kesesuaiannya dengan Entity.
